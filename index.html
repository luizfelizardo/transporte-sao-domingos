<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Consulta - Transporte Escolar | EPG São Domingos</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-blue-900 text-white shadow-lg py-5 px-4 mb-6">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="ph-bold ph-bus text-3xl text-yellow-400"></i>
        <div>
          <h1 class="text-xl font-bold leading-tight">Consulta de Transporte Escolar</h1>
          <p class="text-xs text-blue-200" id="subtituloHeader">EPG São Domingos — Painel do Condutor</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <span id="statusSync" class="text-xs px-2.5 py-1 rounded-full bg-emerald-800 text-emerald-200 flex items-center gap-1 font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online
        </span>
        <button onclick="carregarDadosPlanilha()" class="bg-yellow-500 hover:bg-yellow-400 text-blue-950 font-semibold px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition shadow">
          <i class="ph-bold ph-arrows-clockwise text-sm"></i> Atualizar
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 space-y-6">

    <!-- Filtros de Consulta -->
    <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Veículo / Condutor</label>
        <select id="selectCondutor" onchange="filtrarDados()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm font-medium">
          <option value="">-- Carregando... --</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Filtrar por Período</label>
        <select id="selectPeriodo" onchange="filtrarDados()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm font-medium">
          <option value="">Todos os Períodos</option>
          <option value="Manhã">Manhã</option>
          <option value="Tarde">Tarde</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Buscar Aluno</label>
        <div class="relative">
          <input type="text" id="inputBusca" oninput="filtrarDados()" placeholder="Nome do aluno, turma ou ID..." class="w-full p-2.5 pl-9 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
          <i class="ph ph-magnifying-glass absolute left-3 top-3 text-slate-400 text-base"></i>
        </div>
      </div>
    </section>

    <!-- Cards de Resumo (KPIs) -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500">Total no Veículo</p>
          <h3 id="kpiTotal" class="text-2xl font-bold text-slate-800">0</h3>
        </div>
        <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-lg">
          <i class="ph-bold ph-users text-xl"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500">Outros / PCD</p>
          <h3 id="kpiPcd" class="text-2xl font-bold text-indigo-600">0</h3>
        </div>
        <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-lg">
          <i class="ph-bold ph-wheelchair text-xl"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500">De Projeto</p>
          <h3 id="kpiProjeto" class="text-2xl font-bold text-emerald-600">0</h3>
        </div>
        <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-lg">
          <i class="ph-bold ph-star text-xl"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500">Convencional</p>
          <h3 id="kpiConvencional" class="text-2xl font-bold text-amber-600">0</h3>
        </div>
        <div class="w-10 h-10 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center font-bold text-lg">
          <i class="ph-bold ph-student text-xl"></i>
        </div>
      </div>
    </section>

    <!-- Tabela de Alunos -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">
          <i class="ph-bold ph-list-bullets text-blue-600"></i> Relação de Alunos Transportados
        </h2>
        <span id="countRegistros" class="text-xs font-semibold text-slate-500 bg-slate-200 px-2.5 py-1 rounded-full">0 alunos</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-100 text-xs text-slate-500 uppercase border-b border-slate-200">
            <tr>
              <th class="p-3">ID</th>
              <th class="p-3">Estudante / Turma</th>
              <th class="p-3">Categoria</th>
              <th class="p-3">Período</th>
              <th class="p-3">Veículo</th>
              <th class="p-3">Condutor</th>
              <th class="p-3 text-center">Projeto</th>
            </tr>
          </thead>
          <tbody id="tabelaCorpo" class="divide-y divide-slate-100">
            <tr>
              <td colspan="7" class="text-center py-8 text-slate-400">
                <i class="ph-bold ph-spinner animate-spin text-2xl mb-2 text-blue-600 block mx-auto"></i>
                Carregando alunos...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    const SPREADSHEET_ID = '1RInx03YMirmS637A1oMKk-CIy7TVwxmMZFqLoLUXOxA';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv`;

    let baseDados = [];
    let veiculoUrlParam = '';

    window.addEventListener('DOMContentLoaded', () => {
      // Pega o parametro 'veiculo' ou 'placa' da URL (ex: ?veiculo=ETA5001)
      const urlParams = new URLSearchParams(window.location.search);
      veiculoUrlParam = (urlParams.get('veiculo') || urlParams.get('placa') || '').toUpperCase().trim();

      carregarDadosPlanilha();
      setInterval(carregarDadosPlanilha, 60000);
    });

    function carregarDadosPlanilha() {
      const statusEl = document.getElementById('statusSync');
      statusEl.className = "text-xs px-2.5 py-1 rounded-full bg-amber-800 text-amber-200 flex items-center gap-1 font-medium";
      statusEl.innerHTML = `<i class="ph-bold ph-arrows-clockwise animate-spin"></i> Atualizando...`;

      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            baseDados = results.data.map(item => ({
              id: item['ID'] || item['id'] || 'N/A',
              estudante: item['Estudante'] || item['estudante'] || 'Não informado',
              turma: item['Turma'] || item['turma'] || '',
              categoria: item['Categoria'] || item['categoria'] || 'Convencional',
              periodo: item['Período'] || item['Periodo'] || item['periodo'] || 'Manhã',
              veiculo: (item['Veículo'] || item['Veiculo'] || item['veiculo'] || 'N/A').toUpperCase().trim(),
              condutor: item['Condutor'] || item['condutor'] || 'N/A',
              projeto: item['Projeto'] || item['projeto'] || 'Não'
            }));

            populaCondutores();
            filtrarDados();

            statusEl.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-800 text-emerald-200 flex items-center gap-1 font-medium";
            statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online (${new Date().toLocaleTimeString()})`;
          }
        },
        error: function(err) {
          console.error("Erro ao carregar dados:", err);
        }
      });
    }

    function populaCondutores() {
      const select = document.getElementById('selectCondutor');
      
      // Se tiver parâmetro de veículo na URL, trava a seleção
      if (veiculoUrlParam) {
        const itemCondutor = baseDados.find(d => d.veiculo === veiculoUrlParam);
        const nomeExibicao = itemCondutor ? `${itemCondutor.condutor} (${itemCondutor.veiculo})` : `Veículo ${veiculoUrlParam}`;
        
        select.innerHTML = `<option value="${veiculoUrlParam}">${nomeExibicao}</option>`;
        select.disabled = true; // Trava o campo
        select.classList.add('bg-slate-200', 'cursor-not-allowed');

        document.getElementById('subtituloHeader').textContent = `EPG São Domingos — Painel do Veículo ${veiculoUrlParam}`;
      } else {
        // Visão Geral (Gestão / Administrador)
        const condutoresUnicos = [...new Set(baseDados.map(d => `${d.condutor} (${d.veiculo})`))].sort();
        select.innerHTML = '<option value="">-- Todos os Condutores / Veículos --</option>';
        condutoresUnicos.forEach(c => {
          if(c.trim() !== "N/A (N/A)") {
            const option = document.createElement('option');
            option.value = c;
            option.textContent = c;
            select.appendChild(option);
          }
        });
        select.disabled = false;
      }
    }

    function filtrarDados() {
      const condutorSel = document.getElementById('selectCondutor').value;
      const periodoSel = document.getElementById('selectPeriodo').value;
      const busca = document.getElementById('inputBusca').value.toLowerCase();

      const dadosFiltrados = baseDados.filter(item => {
        let matchCondutor = true;

        if (veiculoUrlParam) {
          matchCondutor = item.veiculo === veiculoUrlParam;
        } else if (condutorSel) {
          const condutorVeiculo = `${item.condutor} (${item.veiculo})`;
          matchCondutor = condutorVeiculo === condutorSel;
        }

        const matchPeriodo = !periodoSel || item.periodo.toLowerCase() === periodoSel.toLowerCase();
        const matchBusca = !busca || 
          item.estudante.toLowerCase().includes(busca) || 
          item.turma.toLowerCase().includes(busca) ||
          item.id.toLowerCase().includes(busca);

        return matchCondutor && matchPeriodo && matchBusca;
      });

      atualizarKPIs(dadosFiltrados);
      renderizarTabela(dadosFiltrados);
    }

    function atualizarKPIs(dados) {
      document.getElementById('kpiTotal').textContent = dados.length;
      document.getElementById('kpiPcd').textContent = dados.filter(d => d.categoria.toLowerCase() !== 'convencional').length;
      document.getElementById('kpiProjeto').textContent = dados.filter(d => d.projeto.toLowerCase() === 'sim').length;
      document.getElementById('kpiConvencional').textContent = dados.filter(d => d.categoria.toLowerCase() === 'convencional').length;
      document.getElementById('countRegistros').textContent = `${dados.length} alunos exibi(dos)`;
    }

    function renderizarTabela(dados) {
      const tbody = document.getElementById('tabelaCorpo');
      if (dados.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">Nenhum registro encontrado para este veículo.</td></tr>`;
        return;
      }

      tbody.innerHTML = dados.map(item => `
        <tr class="hover:bg-slate-50">
          <td class="p-3 font-mono text-xs text-slate-400">${item.id}</td>
          <td class="p-3 font-semibold text-slate-800">
            ${item.estudante}
            ${item.turma ? `<span class="ml-1 text-xs text-slate-400 font-normal">(Turma: ${item.turma})</span>` : ''}
          </td>
          <td class="p-3">
            <span class="px-2 py-1 rounded-full text-xs font-semibold ${
              item.categoria.toLowerCase() === 'convencional' ? 'bg-cyan-100 text-cyan-800' : 'bg-indigo-100 text-indigo-800'
            }">
              ${item.categoria}
            </span>
          </td>
          <td class="p-3 font-medium">${item.periodo}</td>
          <td class="p-3 font-mono text-xs font-bold text-slate-700">${item.veiculo}</td>
          <td class="p-3 font-medium text-slate-700">${item.condutor}</td>
          <td class="p-3 text-center">
            <span class="px-2 py-1 rounded-full text-xs font-bold ${
              item.projeto.toLowerCase() === 'sim' ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500'
            }">
              ${item.projeto}
            </span>
          </td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
